kind = "web"
previewPath = "/"
title = "Reset Mode"
version = "1.0.0"
id = "artifacts/reset-mode"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24364

[services.development]
run = "pnpm --filter @workspace/reset-mode run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/reset-mode", "run", "build" ]
publicDir = "artifacts/reset-mode/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24364"
BASE_PATH = "/"
